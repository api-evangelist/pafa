aid: pafa
name: Pennsylvania Academy of the Fine Arts (PAFA)
description: >-
  The Pennsylvania Academy of the Fine Arts (PAFA) is the United States' first
  museum and school of fine arts, founded in 1805 in Philadelphia by painter
  and scientist Charles Willson Peale, sculptor William Rush, and other
  artists and business leaders. PAFA operates as a 501(c)(3) cultural
  nonprofit at 118-128 North Broad Street, Philadelphia, PA 19102 and
  occupies two connected historic buildings — the Frank Furness and George
  Hewitt-designed Furness-Hewitt Building (1876, designated a National
  Historic Landmark in 1975) and the Samuel M. V. Hamilton Building —
  joined by Lenfest Plaza. PAFA's permanent collection focuses on
  19th- and 20th-century American art and includes works tied to alumni
  and faculty such as Mary Cassatt, Thomas Eakins, Henry Ossawa Tanner,
  William Glackens, Barkley L. Hendricks, Violet Oakley, Cecilia Beaux,
  Louis Kahn, David Lynch, and Njideka Akunyili Crosby, alongside the
  Linda Lee Alter Collection of Art by Women.

  Following a March 2025 announcement of a financial crisis driven by a
  reported roughly $3 million annual deficit and a sharp decline in
  enrollment, PAFA stopped granting its own BFA and MFA degrees beginning
  with the 2024-2025 academic year. As of 2026 the school's active
  educational pathways are the three-year Fine Arts Certificate Program
  ("designed to prepare students for entry-level professional roles within
  the visual arts and related creative industries"), Continuing Education
  classes ("an inclusive studio arts offering for artists of all ages and
  skill levels, from beginners to advanced creatives") delivered in-person
  and online, Youth & Teen programs including Summer Art Camp and Summer
  Academy, and PAFA Shop Memberships providing self-guided access to
  professional-grade printmaking, papermaking, and sculpture studios. The
  museum continues to operate, with admission $25 adults / $23 seniors /
  $10 students / $5 youth / free for children 12 and under and members,
  and is presenting the once-in-a-generation exhibition "A Nation of
  Artists" (April 2026 - September 2027) in partnership with the
  Philadelphia Museum of Art and the Middleton Family Collection.

  PAFA is a cultural nonprofit, not a technology company. It publishes no
  developer portal, no OpenAPI specifications, no SDKs, no public REST or
  GraphQL APIs, no webhooks, no status page, and no engineering blog.
  There is no `github.com/pafa` institutional organization — the user
  account `github.com/pafa` is an unrelated personal account focused on
  ERP and WeChat tooling. The institution's only programmatic third-party
  surface is its participation in the Bloomberg Connects free digital
  museum guide app, which presents PAFA's collection and tours through
  Bloomberg Philanthropies' shared mobile platform. Donations are routed
  through the third-party platform community.pafa.org/give and ticketing
  through standard museum e-commerce.
