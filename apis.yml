  - name: APISurfaceAssessment
    type: Features
    description: >-
      API Evangelist assessment of PAFA's public API and developer surface
      as of May 23, 2026.
    data:
      - finding: Public developer portal
        status: None — no developer.pafa.org or equivalent
      - finding: Public OpenAPI / AsyncAPI specs
        status: None published
      - finding: Public REST or GraphQL APIs
        status: None — ticketing, donations, and account flows are private
      - finding: Donation platform
        status: >-
          Routed to the third-party platform community.pafa.org/give; no
          public API documented
      - finding: SDKs / CLI / webhooks
        status: None published
      - finding: GitHub organization
        status: >-
          No institutional org exists; the github.com/pafa user account is
          an unrelated personal handle focused on ERP and WeChat tooling
      - finding: Status page / changelog / release notes
        status: None public
      - finding: Sandbox / Console
        status: None
      - finding: Public RSS / engineering blog
        status: None — PAFA publishes museum news and exhibition releases only
      - finding: Third-party programmatic distribution
        status: >-
          Bloomberg Connects mobile app (Bloomberg Philanthropies' shared
          free multi-institution digital guide) is PAFA's only programmatic
          third-party distribution surface; API is owned and not exposed
          by Bloomberg Philanthropies
      - finding: Tier rationale
        status: >-
          Tier 3 — no-apis. Cultural nonprofit museum and school with no
          public developer surface. Documented here for completeness of
          the API Evangelist American-art / cultural-institution coverage
          and to record the institution's post-2024-2025 program
          restructuring, not as an API provider.
